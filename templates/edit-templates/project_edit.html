{% extends 'base.html' %}
{% block meta %}
    <title>Edit Project</title>
{% endblock meta %}
{% block content %}
    <main class="edit-page">
        <div class="container edit-page-container">
            <a class="button back-btn" href="{% url 'main:show_project' %}">Back</a>
            <!-- Loading State -->
            <div id="loading" class="empty-state hide">
                <p>Loading projects...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="empty-state hide">
                <p>Failed to load projects data. Please try again.</p>
            </div>

            <!-- Empty State -->
            <div id="empty" class="empty-state hide">
                <p>No project has been added or found.</p>
            </div>

            <!-- Project Container -->
            <div class="section-container hide", id="project-container"></div>
            
            {% for project in project_list %}
                <div class="data-card">
                    
                </div>
            {% endfor %}
        </div>
    </main>
    <script>
        // Konfigurasi
        const BASE_PROJECTS_ENDPOINT = "{% url 'main:get_project_json' %}";
        const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
        const SEARCH_DEBOUNCE_DELAY = 300;
        let searchDebounceTimer;
        let projectsAbortController;

        // Elemen DOM
        const loadingState = document.getElementById('loading');
        const errorState = document.getElementById('error');
        const emptyState = document.getElementById('empty');
        const container = document.getElementById('project-container');

        // Menyembunyikan/Menampilkan section halaman
        function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showContainer = false }) {
            loadingState.classList.toggle('hide', !showLoading);
            errorState.classList.toggle('hide', !showError);
            emptyState.classList.toggle('hide', !showEmpty);
            container.classList.toggle('hide', !showContainer);
        }

        // Mengubah karakter khusus HTML menjadi entity agar ditampilkan sebagai teks
        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        // Membuat elemen card project
        function buildProjectCardElement(item) {
            const project = item.fields;
            const projectId = item.pk;

            const articleElement = document.createElement('div');
            articleElement.className = 'data-card';

            const urlHtml = project.project_url 
                ? `<a class="project-link" href="${ escapeHtml(project.ext_link) }" target="_blank">See the Project</a>`
                : '';

            // Dummy UUID digunakan untuk digantikan oleh ID asli dari data JSON
            const deleteUrl = "{% url 'main:delete_project' '00000000-0000-0000-0000-000000000000' %}"
                .replace('00000000-0000-0000-0000-000000000000', projectId);

            const deleteHtml = IS_SUPERUSER 
                ? `<form method="post" action="${escapeHtml(deleteUrl)}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="button button-danger" onclick="return confirm('Yakin ingin menghapus project ini?');">Hapus</button>
                </form>`
                : '';
                
            // Komponen card
            const completeCardHtml = `
                <div class="data">
                    <p>
                        <span class="label">Project Name</span><br>
                        <span class="value">${escapeHtml(project.project_name)}</span>
                    </p>
                    <p>
                        <span class="label">Project Type</span><br>
                        <span class="value">${escapeHtml(project.project_type)}</span>
                    </p>
                    <p>
                        <span class="label">Project Description</span><br>
                        <span class="value">${escapeHtml(project.project_desc)}</span>
                    </p>
                </div>
                <div class="edit-action">
                    {% if user.is_superuser %}
                    <div class="delete-btn">
                        {% include "components/project_delete_modal.html" %}
                    </div>
                    {% endif %}
                    <div class="update-btn">
                        <form method="get"
                                action="{% url 'main:update_project' project.id %}">
                                <button type="submit" class="button warning-button">Update Project</button>
                        </form>
                    </div>
                </div>
            `;

            articleElement.innerHTML = completeCardHtml;
            return articleElement;
        }

        // Fetch data project
        async function fetchProjects(searchQuery = "") {
            if (projectsAbortController) projectsAbortController.abort();
            projectsAbortController = new AbortController();

            try {
                displayPageSection({ showLoading: true });
                
                const url = searchQuery ? `${BASE_PROJECTS_ENDPOINT}?project_name=${encodeURIComponent(searchQuery)}` : BASE_PROJECTS_ENDPOINT;
                
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' },
                    signal: projectsAbortController.signal,
                });

                if (!response.ok) throw new Error('Failed to fetch data');

                const projectData = await response.json();

                if (projectData.length === 0) {
                    displayPageSection({ showEmpty: true });
                } else {
                    container.innerHTML = '';
                    projectData.forEach(item => {
                        container.appendChild(buildProjectCardElement(item));
                    });
                    displayPageSection({ showGrid: true });
                }
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Error loading projects:', error);
                displayPageSection({ showError: true });
            }
        }

        // Event Handlers untuk Form Search
        function searchProjects() {
            fetchProjects(searchInput.value.trim());
        }

        searchInput.addEventListener("input", function() {
            clearTimeout(searchDebounceTimer);

            searchDebounceTimer = setTimeout(function() {
                searchProjects();
            }, SEARCH_DEBOUNCE_DELAY);
        });

        searchForm.addEventListener("submit", function(event) {
            event.preventDefault();
            clearTimeout(searchDebounceTimer);
            searchProjects();
        });

        function closeProjectModal() {
            document.getElementById("add-project-modal").hidePopover();
        }

            const CREATE_PROJECT_ENDPOINT = "{% url 'main:create_project_ajax' %}";
        const projectForm = document.getElementById('project-form');

        // Membaca nilai cookie, digunakan untuk mengambil token CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Mengirim data form ke server
        async function addProject(event) {
            event.preventDefault();

            const submitButton = projectForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            try {
                const response = await fetch(CREATE_PROJECT_ENDPOINT, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') },
                    body: new FormData(projectForm),
                });
                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    projectForm.reset();
                    closeProjectModal();
                    showToast('Berhasil', 'Proyek baru berhasil ditambahkan!', 'success');
                    fetchProjects(searchInput.value.trim());
                } else {
                    const errorMessages = result.errors
                        ? Object.values(result.errors).flat().map(error => error.message)
                        : [result.message || `Terjadi kesalahan (status ${response.status}).`];
                    showToast('Gagal menambahkan proyek', errorMessages.join(' '), 'error');
                }
            } catch (error) {
                console.error('Error adding project:', error);
                showToast('Gagal menambahkan proyek', 'Tidak dapat terhubung ke server. Silakan coba lagi.', 'error');
            } finally {
                submitButton.disabled = false;
            }
        }

        if (projectForm) {
            projectForm.addEventListener('submit', addProject);
        }

        // Start application
        fetchProjects(searchInput.value.trim());
    </script>
{% endblock content %}
