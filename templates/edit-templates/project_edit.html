{% extends 'base.html' %}
{% block meta %}
    <title>Edit Project</title>
{% endblock meta %}
{% block content %}
    <main class="edit-page">
        <div class="container edit-page-container">
            <a class="button back-btn" href="{% url 'main:show_project' %}">Back</a>
            <!-- Loading State -->
            <div id="loading" class="empty-state hide">
                <p>Loading projects...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="empty-state hide">
                <p>Failed to load projects data. Please try again.</p>
            </div>

            <!-- Empty State -->
            <div id="empty" class="empty-state hide">
                <p>No project has been added or found.</p>
            </div>

            <!-- Project Container -->
            <div class="section-container hide", id="project-container">
                
            </div>

        </div>
    </main>
    <script>
        // Konfigurasi
        const BASE_PROJECTS_ENDPOINT = "{% url 'main:get_project_json' %}";
        const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
        
        const loadingState = document.getElementById('loading');
        const errorState = document.getElementById('error');
        const emptyState = document.getElementById('empty');
        const container = document.getElementById('project-container');

        // Menyembunyikan/Menampilkan section halaman
        function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showContainer = false }) {
            loadingState.classList.toggle('hide', !showLoading);
            errorState.classList.toggle('hide', !showError);
            emptyState.classList.toggle('hide', !showEmpty);
            container.classList.toggle('hide', !showContainer);
        }

        // Mengubah karakter khusus HTML menjadi entity agar ditampilkan sebagai teks
        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        // Membuat elemen card project
        function buildProjectCardElement(item) {
            const project = item.fields;
            const projectId = item.pk;

            const dataCard = document.createElement('div');
            dataCard.className = 'data-card'

            const dataElement = document.createElement('div');
            dataElement.className = 'data';

            const editActionElement = document.createElement('div')
            editActionElement.className = 'edit-action'

            dataElement.innerHTML = `
                <p>
                    <span class="label">Project Name</span><br>
                    <span class="value">${ project.project_name }</span>
                </p>
                <p>
                    <span class="label">Project Type</span><br>
                    <span class="value">${ project.project_type }</span>
                </p>
                <p>
                    <span class="label">Project Description</span><br>
                    <span class="value">${ project.project_desc }</span>
                </p>
            `

            // Dummy UUID digunakan untuk digantikan oleh ID asli dari data JSON
            const deleteUrl = "{% url 'main:delete_project' '00000000-0000-0000-0000-000000000000' %}"
                .replace('00000000-0000-0000-0000-000000000000', projectId);
            const updateUrl = "{% url 'main:update_project' '00000000-0000-0000-0000-000000000000' %}"
                .replace('00000000-0000-0000-0000-000000000000', projectId);

            let editAction = ``;
            if (IS_SUPERUSER) {
                editAction = `
                    <p class="project-status">
                        <button type="button"
                                class="button button-danger"
                                popovertarget="delete-project-${projectId}"
                                aria-label="Hapus ${project.project_name}"
                                title="Delete Project">
                            Delete project
                        </button>
                    </p>
                    <div id="delete-project-${projectId}"
                        class="delete-modal"
                        popover="auto"
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="delete-project-title-${projectId}">
                        <button type="button"
                                class="delete-modal__backdrop"
                                popovertarget="delete-project-${projectId}"
                                popovertargetaction="hide"
                                aria-label="Close confirm delete"></button>
                        <div class="delete-modal__content">
                            <button type="button"
                                    class="delete-modal__close"
                                    popovertarget="delete-project-${projectId}"
                                    popovertargetaction="hide"
                                    aria-label="Close confirm delete">×</button>
                            <h2 id="delete-project-title-${projectId}">Delete Project?</h2>
                            <p>
                                Are you sure you want to delete
                                <strong>${project.project_name}</strong>?
                            </p>
                            <div class="delete-modal__actions">
                                <button type="button"
                                        class="button button-secondary"
                                        popovertarget="delete-project-${projectId}"
                                        popovertargetaction="hide">Cancel</button>
                                <form method="post" action="${deleteUrl}">
                                    {% csrf_token %}
                                    <button type="submit" class="button button-danger">Yes, Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="update-btn">
                        <form method="get"
                                action="${updateUrl}">
                                <button type="submit" class="button warning-button">Update Project</button>
                        </form>
                    </div>
                `
            } else {
                editAction = `
                    <div class="update-btn">
                        <form method="get"
                                action="${updateUrl}">
                                <button type="submit" class="button warning-button">Update Project</button>
                        </form>
                    </div>
                `
            }
            editActionElement.innerHTML = editAction;

            // Komponen card
            dataCard.appendChild(dataElement);
            dataCard.appendChild(editActionElement);

            return dataCard;
        }

        // Fetch data project
        async function fetchProjects() {
            try {
                displayPageSection({ showLoading: true });
                
                const url = BASE_PROJECTS_ENDPOINT;
                
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error('Failed to fetch data');

                const projectData = await response.json();

                if (projectData.length === 0) {
                    displayPageSection({ showEmpty: true });
                } else {
                    container.innerHTML = '';
                    projectData.forEach(item => {
                        container.appendChild(buildProjectCardElement(item));
                    });
                    displayPageSection({ showContainer: true });
                }
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Error loading projects:', error);
                displayPageSection({ showError: true });
            }
        }

        // Start application
        fetchProjects();
    </script>
{% endblock content %}
