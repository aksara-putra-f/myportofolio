{% extends "base.html" %}
{% block meta %}
    <title>Add Education - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main class="form-page">
        <section class="education-form-page">
            <div class="container">
                <h1>{{ title }}</h1>
                <form method="post"
                      action="{% if is_updating_item %}{% url 'main:update_education' form.instance.pk %}{% else %}{% url 'main:create_education' %}{% endif %}"
                      enctype="multipart/form-data"
                      class="education-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">{% if is_updating_item %}Update Education{% else %}Add Education{% endif %}</button>
                    <a href="{% if is_updating_item %}{% url 'main:edit_education' %}{% else %}{% url 'main:show_education' %}{% endif %}" class="button button-secondary">Cancel</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
