{% extends "base.html" %}
{% block meta %}
    <title>Add Project - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main class="form-page">
        <section class="skill-form-page">
            <div class="container">
                <h1>Add New Skill Item</h1>
                <form method="post"
                      action="{% url 'main:create_skill' %}"
                      class="form skill-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Add Skill</button>
                    <a href="{% url 'main:show_skill' %}" class="button button-secondary">Cancel</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
