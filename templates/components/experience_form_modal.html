<div id="add-experience-modal"
     class="form-modal experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="form-modal__backdrop experience-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form"></button>

    <div class="form-modal__content experience-form-modal__content">
        <button type="button"
                class="form-modal__close experience-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Close add experience form">×</button>

        <h2 id="add-experience-modal-title">Add New experience</h2>
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              class="experience-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="form-modal__actions experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add experience</button>
            </div>
        </form>
    </div>
</div>
