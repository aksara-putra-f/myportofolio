<p class="project-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ project.id }}"
            aria-label="Hapus {{ project.project_name }}"
            title="Delete Project">
        Delete project
    </button>
</p>
<div id="delete-project-{{ project.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Close confirm delete"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Close confirm delete">×</button>
        <h2 id="delete-project-title-{{ project.id }}">Delete Project?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ project.project_name }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
