<div class="item-action" hidden>
    <button class="button action-button edit-button"
            data-action="edit"
            data-id=""
            type="button">Edit</button>
    {% if user.is_superuser %}
    <button class="button action-button delete-button"
            data-action="delete"
            data-id=""
            type="button">Delete</button>
    {% endif %}
</div>
